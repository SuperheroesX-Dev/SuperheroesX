buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
    }
}

apply plugin: 'net.minecraftforge.gradle'
//Only edit below this line, the above code adds and enables the necessary things for Forge to be setup.

version = "0.3.1"

group = "sx_dev.sx"  // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = ("SuperheroesX")

sourceCompatibility = targetCompatibility = '1.8' // Need this here so eclipse task generates correctly.

compileJava {
    sourceCompatibility = targetCompatibility = '1.8'

}

repositories {
   /* maven {
        name = "CoFH Maven"
        url = "http://maven.covers1624.net"
    } */
    maven {
        // location of the maven that hosts JEI files
        name = "Progwml6 maven"
        url = "http://dvs1.progwml6.com/files/maven"
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "modmaven.k-4u.nl"
    }
    maven {
        name = "ChikenMaven"
        url = "http://chickenbones.net/maven/"
    }
    maven {
        name = 'DVS1 Maven FS'
        url = 'http://dvs1.progwml6.com/files/maven'
    }
}

dependencies {
    compile "cofh:ThermalExpansion:1.12.2-5.3.9.9:universal"
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860'
    compile "slimeknights.mantle:Mantle:1.12-1.3.2.24"
    compile "slimeknights:TConstruct:1.12.2-2.9.1.65"

    compile "cofh:RedstoneFlux:1.12-2.1.1.1:universal"
    // compile against the JEI API but do not include it at runtime
    compile "mezz.jei:jei_1.12.2:4.16.1.302:api"
    // at runtime, use the full JEI jar
    //runtime "mezz.jei:jei_${mc_version}:${jei_version}"
}

minecraft {

    mappings channel: 'snapshot', version: '20171003-1.12'

    processResources {
        // this will ensure that this task is redone when the versions change.
        inputs.property "version", project.version
        // replace stuff in mcmod.info, nothing else
        from(sourceSets.main.resources.srcDirs) {
            include 'mcmod.info'
            // replace version and mcversion
        }
        // copy everything else except the mcmod.info
        from(sourceSets.main.resources.srcDirs) {
            exclude 'mcmod.info'
        }
    }


    jar {
        classifier = 'universal'
    }

    runs {
        client {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'
        }

        server {

            // Recommended logging data for a userdev environment
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'
        }
    }

}